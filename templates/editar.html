<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Totalização Mensal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h2 class="mb-4">Editar Totais do Mês: {{ registro.local }}</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} fw-bold" role="alert">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form action="/editar/{{ id }}" method="POST" class="border p-4 rounded bg-light w-50">
        <div class="mb-3">
            <label class="fw-bold">Histórico de Dias (Ex: 05/09, 12/09):</label>
            <input type="text" name="datas_historico" class="form-control" value="{{ registro.data }}" required>
        </div>
        <div class="mb-3">
            <label class="fw-bold">Corrigir Média de Referência Mensal:</label>
            <input type="number" name="media" class="form-control" value="{{ registro.media_aplicada }}" required
                min="1">
        </div>
        <div class="mb-3">
            <label class="fw-bold">Corrigir SOMA TOTAL de Folhas:</label>
            <input type="number" name="folhas" class="form-control" value="{{ registro.folhas }}" required min="0">
        </div>
        <div class="mb-4">
            <label class="fw-bold">Corrigir SOMA TOTAL de Toners:</label>
            <input type="number" name="toners" class="form-control" value="{{ registro.toners }}" required min="0">
        </div>
        <button type="submit" class="btn btn-success">Salvar Alterações</button>
        <a href="/" class="btn btn-secondary ms-2">Cancelar</a>
    </form>

</body>

</html>
