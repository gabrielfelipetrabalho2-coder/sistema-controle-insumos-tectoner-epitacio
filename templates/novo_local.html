<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastrar Novo Local</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h2 class="mb-4">Adicionar Novo Setor ao Sistema</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} fw-bold" role="alert">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form action="/novo_local" method="POST" class="border p-4 rounded bg-light w-50">
        <div class="mb-4">
            <label class="fw-bold">Nome do Novo Local (Escola/Creche/Setor):</label>
            <input type="text" name="nome_local" class="form-control mt-2" required
                placeholder="Ex: Secretaria de Obras">
        </div>
        <button type="submit" class="btn btn-primary">Salvar Local</button>
        <a href="/" class="btn btn-secondary ms-2">Voltar</a>
    </form>

</body>

</html>
