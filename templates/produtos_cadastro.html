{% extends 'base.html' %}
{% block titulo_pagina %}Cadastrar Novo Produto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>➕ Montar Estrutura de Produto</h4>
            <a href="/produtos" class="btn btn-secondary btn-sm fw-bold">⬅️ Voltar para Lista</a>
        </div>

        <div class="card shadow-sm border-primary">
            <div class="card-header bg-primary text-white fw-bold">
                Definir Novo Produto Dinâmico
            </div>
            <div class="card-body bg-light">
                <form action="/produtos/nova" method="POST">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome do Produto/Categoria (Ex: Toner Ricoh)</label>
                        <input type="text" name="nome_categoria" class="form-control" required>
                    </div>

                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" name="mostrar_dashboard" id="chkDashboard"
                            checked>
                        <label class="form-check-label fw-bold text-success" for="chkDashboard">
                            Fixar este produto na tabela "Modelos Disponíveis" do Dashboard
                        </label>
                    </div>

                    <h6 class="fw-bold text-secondary border-bottom pb-2">Estrutura de Colunas (Atributos)</h6>
                    <div id="atributos-container">
                        <div class="row g-2 mb-2 atributo-row">
                            <div class="col-md-5">
                                <input type="text" name="coluna_nome[]" class="form-control form-control-sm"
                                    placeholder="Nome (Ex: Marca, Data)" required>
                            </div>
                            <div class="col-md-5">
                                <select name="coluna_tipo[]" class="form-select form-select-sm">
                                    <option value="text">Texto (String)</option>
                                    <option value="number">Número (Int/Float)</option>
                                    <option value="date">Data (Date)</option>
                                    <option value="checkbox">Caixa de Seleção (Boolean)</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-sm btn-danger w-100 remover-atributo">🗑️</button>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn btn-sm btn-outline-success fw-bold mb-4" id="btn-add-atributo">+
                        Adicionar Coluna</button>
                    <button type="submit" class="btn btn-primary w-100 fw-bold fs-5 shadow-sm">Cadastrar Estrutura do
                        Produto</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('btn-add-atributo').addEventListener('click', function () {
        const container = document.getElementById('atributos-container');
        const newRow = document.createElement('div');
        newRow.className = 'row g-2 mb-2 atributo-row';
        newRow.innerHTML = `
        <div class="col-md-5"><input type="text" name="coluna_nome[]" class="form-control form-control-sm" placeholder="Nome" required></div>
        <div class="col-md-5">
            <select name="coluna_tipo[]" class="form-select form-select-sm">
                <option value="text">Texto (String)</option>
                <option value="number">Número (Int/Float)</option>
                <option value="date">Data (Date)</option>
                <option value="checkbox">Caixa de Seleção (Boolean)</option>
            </select>
        </div>
        <div class="col-md-2"><button type="button" class="btn btn-sm btn-danger w-100 remover-atributo">🗑️</button></div>
    `;
        container.appendChild(newRow);
    });

    document.getElementById('atributos-container').addEventListener('click', function (e) {
        if (e.target.classList.contains('remover-atributo') || e.target.parentElement.classList.contains('remover-atributo')) {
            e.target.closest('.atributo-row').remove();
        }
    });
</script>
{% endblock %}
