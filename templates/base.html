<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Sistema Tectoner - Prefeitura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones Profissionais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
    <style>
        body {
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #f8f9fa;
        }

        /* Estilo do Menu Lateral */
        #sidebar {
            min-width: 260px;
            max-width: 260px;
            background-color: #212529;
            color: white;
            transition: all 0.3s ease-in-out;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        #sidebar.collapsed {
            min-width: 0;
            max-width: 0;
            overflow: hidden;
            padding: 0 !important;
        }

        #sidebar .nav-link {
            color: #adb5bd;
            padding: 12px 20px;
            border-radius: 0;
            font-weight: 500;
        }

        #sidebar .nav-link:hover,
        #sidebar .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }

        /* Área de Conteúdo */
        #content {
            flex-grow: 1;
            transition: all 0.3s;
            padding: 20px;
            width: 100%;
        }

        .toggle-btn {
            cursor: pointer;
            font-size: 24px;
            color: #495057;
        }

        .toggle-btn:hover {
            color: #0d6efd;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR (Menu Lateral) -->
    <nav id="sidebar" class="d-flex flex-column flex-shrink-0 pt-3">
        <div class="px-3 pb-3 mb-3 fs-5 fw-bold border-bottom text-center text-white">
            <i class="fa-solid fa-print me-2 text-primary"></i>Tectoner Epitácio
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                    <i class="fa-solid fa-chart-line me-2"></i> Dashboard & Envios
                </a>
            </li>
            <li>
                <a href="/produtos" class="nav-link {% if '/produtos' in request.path %}active{% endif %}">
                    <i class="fa-solid fa-boxes-stacked me-2"></i> Produtos Dinâmicos
                </a>
            </li>
            <li>
                <a href="/impressoras" class="nav-link text-white">
                    <i class="fa-solid fa-print me-2"></i> Gestão de Impressoras
                </a>
                
            </li>
        </ul>
        <div class="p-3 border-top text-center text-secondary small">
            Versão ERP Dinâmico
        </div>
    </nav>

    <!-- ÁREA CENTRAL DO SISTEMA -->
    <div id="content">
        <!-- Cabeçalho de navegação (Hamburger) -->
        <div class="d-flex align-items-center mb-4 border-bottom pb-2">
            <i class="fa-solid fa-bars toggle-btn me-3" id="toggleSidebar" title="Recolher/Expandir Menu"></i>
            <h4 class="mb-0 fw-bold text-secondary">
                {% block titulo_pagina %}Sistema Integrado{% endblock %}
            </h4>
        </div>

        <!-- Onde o conteúdo das outras telas vai aparecer -->
        {% block content %}{% endblock %}
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Lógica de esconder o menu lateral
        document.getElementById('toggleSidebar').addEventListener('click', function () {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
